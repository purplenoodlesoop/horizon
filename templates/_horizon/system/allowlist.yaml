tools:
  - name: read_file
    description: Read a file from the vault
    parameters:
      path:
        type: path
        description: Relative path within the vault
    command: "cat {vault_path}/{path}"

  - name: write_file
    description: Write content to a file in the vault, OVERWRITING any existing content. Use this for new files or when you intentionally want to replace the entire file. For appending to an existing file (journals, logs), use append_file instead — write_file with partial content silently truncates the rest.
    parameters:
      path:
        type: path
        description: Relative path within the vault (will create directories)
      content:
        type: string
        description: Full file content to write. Whatever was in the file before is gone after this call.
    command: "mkdir -p $(dirname {vault_path}/{path}) && printf '%s' {content} > {vault_path}/{path}"

  - name: append_file
    description: Append content to the end of a vault file without touching anything that's already there. Creates the file if it doesn't exist. Use this for journals, logs, and any file where the convention is "add a new line/entry" — write_file with partial content would truncate the existing entries.
    parameters:
      path:
        type: path
        description: Relative path within the vault (will create directories)
      content:
        type: string
        description: Content to append. Include a leading newline if you want a line break before your addition.
    command: "mkdir -p $(dirname {vault_path}/{path}) && printf '%s' {content} >> {vault_path}/{path}"

  - name: list_files
    description: List all markdown files in the vault
    command: "find {vault_path} -name '*.md' -type f 2>/dev/null | sort"

  - name: search_vault
    description: "Search your notes and get the MATCHING CONTENT back — path, line number, and surrounding lines — not just filenames. This is how you build context: one search shows what is actually written across your notes. Case-insensitive extended-regex; matches substrings so a stem works across languages (\"автобус\" also matches \"автобуса\"). Skips the system namespace and your personal dataview/ views."
    parameters:
      query:
        type: string
        description: "A keyword, word-stem, or extended-regex (grep -E). Case-insensitive."
    command: "r=$(grep -rniE --include='*.md' --exclude-dir=_horizon --exclude-dir=dataview -B1 -A2 {query} {vault_path} 2>/dev/null | sed \"s#{vault_path}/##\" | head -150); if [ -n \"$r\" ]; then printf '%s\\n' \"$r\"; else echo \"No note body matched {query}. This is NOT proof you have nothing on it — a body search misses a different wording, another language, a title-only mention, or the excluded _horizon/ and dataview/ folders. Before telling the user no such note exists, run list_notes to scan every note by title.\"; fi"

  - name: list_notes
    description: "List every note you have, with its title — so you can see WHAT ALREADY EXISTS before searching, and never offer to create a note that is already there. Path + title, one per line. Skips the system namespace and your dataview/ views."
    command: "find {vault_path} -name '*.md' -type f -not -path '*/_horizon/*' -not -path '*/dataview/*' 2>/dev/null | sort | while read f; do t=$(grep -m1 -iE '^(title:|# )' \"$f\" 2>/dev/null | sed -E 's/^title:[[:space:]]*//I; s/^#[[:space:]]*//'); echo \"${f#{vault_path}/}${t:+  —  $t}\"; done"

  - name: read_note_and_links
    description: "Read a note AND every note it [[links]] to, in one step — so you can follow the connections in your vault (people, related notes) and build context without re-reading each link by hand."
    parameters:
      path:
        type: path
        description: Vault-relative path to the starting note.
    command: "f={vault_path}/{path}; cat \"$f\" 2>/dev/null; grep -oE '\\[\\[[^]|#]+' \"$f\" 2>/dev/null | sed 's/^\\[\\[//' | sort -u | while read l; do lf={vault_path}/\"$l\".md; if [ -f \"$lf\" ]; then echo; echo \"===== linked: $l =====\"; cat \"$lf\"; fi; done"

  - name: count_matches
    description: Counts the number of vault files whose contents match a regex, scoped to a path glob. Returns a single integer. Use whenever the user asks "how many" of something — the LLM is unreliable at counting lists by inspection over ~10 items, so reach for this instead.
    parameters:
      query:
        type: string
        description: Extended regex (grep -E) to match against file contents.
      path:
        type: string
        description: Path glob relative to vault root, e.g. "todos/*.md", "people/*.md".
    command: "files=$(find {vault_path} -type f -wholename {vault_path}/{path} 2>/dev/null | wc -l | tr -d ' '); if [ \"$files\" = 0 ]; then echo \"0 — WARNING: the glob {path} matched no files at all, so this is not a real count; the path shape is probably wrong. Use list_files_glob to find the correct path before reporting a count.\"; else find {vault_path} -type f -wholename {vault_path}/{path} -exec grep -lE {query} {} + 2>/dev/null | wc -l | tr -d ' '; fi"

  - name: delete_file
    description: Delete a file from the vault
    parameters:
      path:
        type: path
        description: Relative path within the vault
    command: "if [ -e {vault_path}/{path} ]; then rm -f {vault_path}/{path} && echo \"Deleted {path}\"; else echo \"Nothing to delete — {path} does not exist in the vault.\"; fi"

  - name: now
    description: "Returns the current LOCAL datetime WITH its explicit UTC offset, weekday name, ISO week, and ISO day-of-week (1=Mon..7=Sun). Format: `YYYY-MM-DDTHH:MM:SS+OO:OO Weekday (week NN, day N)` (e.g. `2026-05-09T21:23:11+03:00 Saturday (week 19, day 6)`). This IS the user's real wall-clock time — use it whenever you need the time, the date, the weekday, or to compute a date relative to now. The offset is explicit so you never guess the timezone; pass times back to schedule_* in this same offset-qualified form."
    command: "date +'%Y-%m-%dT%H:%M:%S%:z %A (week %V, day %u)'"

  - name: list_files_glob
    description: List vault files matching a glob pattern. Two modes - if the pattern contains a slash, it's matched against the path relative to vault root (e.g. "todos/*.md" finds md files directly under todos/, "_horizon/turns/*.md" finds turn records). If the pattern has no slash, it's matched against the basename anywhere in the vault recursively (e.g. "*.json" finds all JSON files). Note - "*" never crosses "/", and "**" is NOT supported - use a basename-only pattern for "anywhere recursive".
    parameters:
      pattern:
        type: string
        description: Glob pattern. With a slash - path relative to vault root, "*" matches one segment. Without a slash - basename matched recursively. Examples - "todos/*.md", "_horizon/turns/*.md", "*.json", "people/*.md"
    command: "r=$(case {pattern} in */*) find {vault_path} -type f -wholename {vault_path}/{pattern} 2>/dev/null ;; *) find {vault_path} -type f -name {pattern} 2>/dev/null ;; esac | sort); if [ -n \"$r\" ]; then printf '%s\\n' \"$r\"; else echo \"No files match {pattern}. Empty means the glob did not match, not that the files are absent — check the shape: a star matches one path segment and never crosses a slash, double-star is unsupported, use a slash for path-relative or no slash for basename-anywhere.\"; fi"

  - name: fetch_url
    description: Fetch a URL and return its raw response body. Use for JSON APIs, plain-text endpoints, or when you specifically want raw HTML. For human-readable web pages, prefer fetch_url_text which strips HTML to readable markdown.
    parameters:
      url:
        type: string
        description: Full URL including https:// or http://
    command: "if b=$(curl -sSL --max-time 20 -A 'Horizon/1.0' --fail-with-body {url} 2>/dev/null); then printf '%s' \"$b\"; else printf 'Error: the request failed or the server returned an HTTP error status. Any text below is the error page or a partial response, NOT the content you asked for — do not present it as the real answer:\\n%s' \"$b\"; fi"

  - name: fetch_url_text
    description: Fetch a webpage and return readable markdown via Jina Reader. Use for HTML pages where you want clean text content without ads, nav, or markup noise.
    parameters:
      url:
        type: string
        description: Full URL including https:// or http://
    command: "if b=$(curl -sSL --max-time 30 -A 'Horizon/1.0' --fail-with-body 'https://r.jina.ai/'{url} 2>/dev/null); then printf '%s' \"$b\"; else printf 'Error: the page fetch failed (the reader service or the target URL returned an error). Any text below is an error page, NOT the content — do not present it as the answer:\\n%s' \"$b\"; fi"

  - name: web_search
    description: Search the web with Tavily and return top results as JSON. Use when you need information from the web that you don't already know - news, current facts, references, anything beyond the vault.
    parameters:
      query:
        type: string
        description: Search query in plain English
    command: "if [ -z \"$TAVILY_TOKEN\" ]; then echo 'Error: web_search is not configured (TAVILY_TOKEN unset). You cannot search the web right now — tell the user web search is unavailable rather than guessing.' >&2; exit 1; fi; jq -n --arg key \"$TAVILY_TOKEN\" --arg q {query} '{api_key:$key,query:$q,max_results:5,search_depth:\"basic\"}' | curl -sS --max-time 30 -X POST 'https://api.tavily.com/search' -H 'Content-Type: application/json' -d @-"

  - name: schedule_reminder
    description: "Schedule a one-shot reminder. Fires once at fire_at, then auto-deletes. Use when the user says 'remind me at X', 'in 30 minutes', 'tomorrow at 9'. For recurring jobs (every weekday, every Friday at noon), use schedule_cron instead."
    parameters:
      id:
        type: string
        description: "Kebab-case unique identifier, e.g. 'call-mom-friday' or 'check-deploy-tonight'. Should be descriptive — the user reads it in /list-schedules."
      fire_at:
        type: string
        description: "Either an ISO-8601 timestamp WITH its UTC offset — the same offset-qualified local form the `now` tool returns, e.g. '2026-05-15T14:00:00+03:00' — OR a relative duration ('30m', '2h', '1d', '1w'). Take the offset from `now` so the fire time is unambiguous; the scheduler converts it to UTC internally."
      prompt:
        type: string
        description: "The user-message text the orchestrator will receive when the reminder fires. Phrase it as if the user just sent the message — e.g. 'Time to call mom — tell me what to say.'"
      deliver:
        type: string
        description: "Delivery target. For a reminder meant for the person you are talking to right now, use 'origin' (or just leave it 'origin') — the harness auto-resolves it to the CURRENT chat at creation, so it always reaches them. Use 'telegram(<chat_id>)' only to target a DIFFERENT chat (chat_id from _horizon/messages/ frontmatter). Use 'none' for a silent run. Note: outside a live chat (e.g. created during a heartbeat) 'origin' has no chat to resolve to and won't deliver — pass an explicit telegram(<chat_id>) there."
    command: "d={deliver}; case \"$d\" in origin|\"\") [ -n \"$HORIZON_CHAT_ID\" ] && d=\"telegram($HORIZON_CHAT_ID)\";; esac; mkdir -p {vault_path}/_horizon/schedules && { printf -- '---\\nid: %s\\nschedule: %s\\ndeliver: %s\\ncreated_by: agent\\ncreated_at: %s\\nexpires_after: 1\\nprompt: |\\n' {id} {fire_at} \"$d\" \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" && printf '%s' {prompt} | sed 's/^/  /'; printf '\\n---\\n'; } > {vault_path}/_horizon/schedules/{id}.md && echo \"Scheduled {id} for {fire_at} (deliver: $d)\""

  - name: schedule_cron
    description: "Schedule a recurring job using a 5-field cron expression. Use for 'every morning at 9', 'every weekday', 'every Sunday'. For one-shot reminders, use schedule_reminder."
    parameters:
      id:
        type: string
        description: "Kebab-case unique identifier, e.g. 'morning-standup' or 'weekly-review'."
      cron:
        type: string
        description: "5-field cron expression: 'minute hour day-of-month month day-of-week'. Evaluated in UTC, so convert the user's LOCAL time to UTC using the offset from `now` (e.g. 'every weekday 9am' at +03:00 → '0 6 * * 1-5'). '*/15 * * * *' step values are NOT supported — use an explicit list '0,15,30,45 * * * *'."
      prompt:
        type: string
        description: "The user-message text the orchestrator will receive on each fire."
      deliver:
        type: string
        description: "Delivery target. 'origin' (default) auto-resolves to the chat you are talking in now; 'telegram(<chat_id>)' targets a specific other chat; 'none' is silent. Outside a live chat, 'origin' won't deliver — use telegram(<chat_id>)."
    command: "d={deliver}; case \"$d\" in origin|\"\") [ -n \"$HORIZON_CHAT_ID\" ] && d=\"telegram($HORIZON_CHAT_ID)\";; esac; mkdir -p {vault_path}/_horizon/schedules && { printf -- '---\\nid: %s\\nschedule: %s\\ndeliver: %s\\ncreated_by: agent\\ncreated_at: %s\\nprompt: |\\n' {id} {cron} \"$d\" \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" && printf '%s' {prompt} | sed 's/^/  /'; printf '\\n---\\n'; } > {vault_path}/_horizon/schedules/{id}.md && echo \"Scheduled cron {id} (deliver: $d)\""

  - name: cancel_schedule
    description: "Delete a schedule entry by id. Use when the user says 'cancel that reminder' or you decide a previously-set schedule is no longer needed. Idempotent — deleting a non-existent schedule is a no-op."
    parameters:
      id:
        type: string
        description: "Schedule id (the same id used when creating it)."
    command: "if [ -e {vault_path}/_horizon/schedules/{id}.md ]; then rm -f {vault_path}/_horizon/schedules/{id}.md {vault_path}/_horizon/schedules/.lastfire/{id} {vault_path}/_horizon/schedules/.firecount/{id}; echo \"Cancelled {id}\"; else echo \"No schedule named {id} exists — nothing to cancel.\"; fi"

  - name: list_schedules
    description: "List active schedule entries. Returns id + schedule field for each. Use when the user asks 'what reminders do I have' or 'what's scheduled'."
    command: "find {vault_path}/_horizon/schedules -maxdepth 1 -name '*.md' -type f 2>/dev/null | sort | while read f; do id=$(basename \"$f\" .md); sched=$(awk '/^schedule:/ {sub(/^schedule: */, \"\"); print; exit}' \"$f\"); echo \"$id  $sched\"; done"

  - name: extract_pdf
    description: "Extract plain text from a PDF file in the vault using pdftotext. Use this whenever the user sends a PDF (event content shows `[file:...pdf mime=application/pdf]`) — read_file just returns raw bytes for binary formats. Preserves layout reasonably for tables/columns. Note: works only for PDFs with a text layer; pure-image (scanned) PDFs return empty output."
    parameters:
      path:
        type: path
        description: Relative path within the vault to the PDF file (typically `_horizon/messages/files/<event_id>-<name>.pdf`).
    command: "pdftotext -layout {vault_path}/{path} -"

  - name: send_telegram
    description: Send a message proactively to a Telegram chat. Use when something the user should know about happens outside an active conversation - a scheduled reminder firing, a pattern noticed, a deadline approaching. To find a chat_id, look at recent inbound messages in _horizon/messages/ - their frontmatter has chat_id when channel is telegram. The harness rejects any chat_id that has not previously sent us an accepted message. Do not send without a real reason; the user will lose trust if you spam.
    parameters:
      chat_id:
        type: telegram_chat_id
        description: Telegram chat_id of the user. Must be a chat_id that has previously sent the bot an accepted message (i.e. present in _horizon/messages/ frontmatter). The harness validates this and rejects unknown chat_ids.
      text:
        type: string
        description: "Telegram-flavored HTML body, max ~4000 characters. Supported tags: <b>, <i>, <u>, <s>, <code>, <pre>, <a href=\"...\">. Escape literal < > & as &lt; &gt; &amp; — Telegram returns HTTP 400 on invalid HTML. Do NOT use Markdown (**bold**, *italic*, `code`); those will render as literal characters."
    command: "curl -sS --max-time 15 -X POST \"https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage\" --data-urlencode chat_id={chat_id} --data-urlencode text={text} --data-urlencode parse_mode=HTML"

  - name: send_telegram_document
    description: "Send a vault file to a Telegram chat as a document attachment. Use when a task produces an artifact (findings.md, a generated report, an exported file) that is too large or too rich to inline in a chat message — the user can tap the attachment to read or save it. The caption is plain text only (~1000 chars); use send_telegram separately for an HTML-formatted intro message. Same chat_id rules as send_telegram. Files up to 50 MB are supported by Telegram's bot API."
    parameters:
      chat_id:
        type: telegram_chat_id
        description: Telegram chat_id of the user. Must be a chat_id that has previously sent the bot an accepted message (i.e. present in _horizon/messages/ frontmatter). The harness validates this and rejects unknown chat_ids.
      path:
        type: path
        description: Vault-relative path to the file to attach. Validated to stay under the vault root.
      caption:
        type: string
        description: "Optional plain-text caption shown beneath the attachment in Telegram. Max ~1000 chars. Use an empty string for no caption. Plain text only — HTML markup is rendered literally in captions."
    command: "f={vault_path}/{path}; m=application/octet-stream; case \"$f\" in *.md|*.markdown) m=text/markdown;; *.txt|*.log) m=text/plain;; *.json) m=application/json;; *.csv) m=text/csv;; *.html|*.htm) m=text/html;; *.yaml|*.yml) m=application/x-yaml;; *.pdf) m=application/pdf;; *.png) m=image/png;; *.jpg|*.jpeg) m=image/jpeg;; esac; curl -sS --max-time 60 -X POST \"https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument\" -F chat_id={chat_id} -F \"document=@$f;type=$m\" -F caption={caption}"

